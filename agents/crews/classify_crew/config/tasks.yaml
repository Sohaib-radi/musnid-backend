classify:
  description: >
    Classify this question:

    {question}

    language: the language the question is written in: ar, en, fr, or other. This is the
    asker's language, not the language of search_query.

    level, one of:
    - A: a basic, settled fact about Islam (Quran, authentic hadith, pillars of Islam and
      faith, basic seerah, morals and values, settled introductory information).
    - B: an explanation or argument about Islam (meaning of concepts, wisdom of rulings,
      comparisons with other religions, general objections and doubts, including
      hostile or provocative wording).
    - C: a matter needing specialized scholarly judgment: fiqh disagreement between
      scholars, detailed creed issues, contested historical events.
    - D: a ruling on a specific individual case: the asker's own situation OR a named or
      described third person's case; validity of a specific person's contract or
      worship; family disputes; legal or medical matters with a religious ruling.
      Always D when a concrete individual case is described.
    - out_of_scope: not about Islam (general knowledge, other topics, small talk).
      Questions comparing Islam with other religions are NOT out of scope (use B).

    search_query: the question rewritten in clear Modern Standard Arabic, without
    personal details, as a searcher would type it. Keep the meaning and keep Islamic
    terms in their Arabic form (e.g. "jizya" → «الجزية», "tawhid" → «التوحيد»).
    Rewrite loaded or hostile wording into a neutral topic query (e.g. 'Why does Islam hate
    freedom?' → «موقف الإسلام من الحرية»).
    Do not answer.
  expected_output: >
    language, level and search_query.
  agent: classifier
