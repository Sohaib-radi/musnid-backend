write:
  description: >
    Question: {question}

    Answer language: {language}. Level: {level}.

    Evidence (each passage starts with its reference [Q<n>]):

    {evidence}

    Rules:
    - Answer ONLY from the evidence above. If it does not answer the question, say so briefly.
    - Term and definition questions (what a term means, how to translate it): give a simple
      explanation first, then name the term. When translating, copy EXACTLY the English
      equivalent written in parentheses in the glossary entry (all of it, e.g.
      "Tawhid / Oneness of God") and keep the original term next to it.
    - A glossary entry is guidance for you, not text for the asker: extract the definition
      inside it (e.g. «إفراد الله بالربوبية والألوهية، ووصفه بما جاء به الوحي من أسمائه
      الحسنى») and explain it in simple words, then name the term. Never copy guidance
      phrases like «يُفضَّل إبقاء المصطلح» or «ولا يُختزل» into the answer.
    - Order of the answer:
      1. Framing first: if the evidence contains framing or context sentences (for example
         «الإسلام اهتم بالمرأة وحفظ حقوقها…»), state them first.
      2. Then the direct answer: if the evidence contains a direct answer to the question
         (for example «الإسلام لم ينتشر بالسيف»), state it next, staying as close as possible
         to the evidence's own words, with its [Q<n>]. Without framing sentences, your FIRST
         sentence states it.
      3. Then the reasons and supporting details.
      Never open a sensitive answer with its most controversial sentence.
    - Write in the answer language ({language}).
    - Tone: calm, respectful and welcoming. Never rebuke or mock the asker. If the question
      contains a misconception or hostile wording, do not mirror it: correct it gently using
      the evidence, without giving up any information.
    - Cite every claim with the reference of the passage it comes from, e.g. [Q229], or
      [G:التوحيد] for an entry of the official glossary. Use only references that appear in
      the evidence.
    - NEVER quote the Quran or hadith from memory. Where the evidence shows [آية], refer to
      the verse ("as stated in a verse") without reconstructing its text.
    - If the level is C: state that scholars differ, and make no absolute claims.
    - Stay close to the wording of the evidence. Add no conclusions, interpretations,
      generalizations or summaries of your own.
    - Do not use connectors such as "مما يدل على", "this shows that", "this means" or
      "rather than" unless the evidence itself states that link.
    - Be concise: a few short paragraphs.
  expected_output: >
    The answer, with [Q<n>] citations.
  agent: writer

verify:
  description: >
    Question: {question}

    Level: {level}.

    Evidence:

    {evidence}

    Check the writer's draft against the evidence, sentence by sentence:
    - For each sentence, find an exact passage of the evidence that states what the
      sentence says, and copy it word for word as the quote, in the evidence's original
      language (Arabic), even when the answer is in English or French. Never translate or
      paraphrase the quote: a translated or paraphrased quote counts as missing.
    - A sentence is supported only if the quote states it. Conclusions, inferences,
      generalizations or details that the evidence does not state are NOT supported.
    - Keep only supported sentences, each with its quote and its citation ([Q<n>] or
      [G:<term>]) exactly as written. Drop every other sentence. Do not add anything.
    - If the level is C, keep the sentence saying that scholars differ.
    - Keep the draft's language.
    Then write the question's MAIN ask in one short sentence (what the asker actually wants
    to know), and say whether the kept sentences, read alone, answer it (answers_main_ask).
    Judge coverage against that main ask:
    - full: the kept sentences answer the main ask completely.
    - partial: the kept sentences answer the main ask, but not every part of the question.
    - none: the kept sentences do not answer the main ask, even if they discuss related
      topics (definitions of nearby terms, context, history, other aspects). Related
      material without the answer to the main ask is "none", never "partial".
  expected_output: >
    The supported sentences, each with its quote, and the coverage.
  agent: verifier
  context:
    - write
