# nginx site for the Musnid backend on the VPS (ADR 0018).
#
# Installed as /etc/nginx/sites-available/api.musnid.online and enabled with a
# symlink in sites-enabled. It starts as plain HTTP so certbot can prove the
# domain; `certbot --nginx -d api.musnid.online` then adds the 443 server with
# the certificate and turns this one into a redirect. Steps:
# docs/getting-started/deployment.md

server {
    listen 80;
    listen [::]:80;
    server_name api.musnid.online;

    # Questions carry a few hundred characters; admin forms are small. 10 MB is a
    # ceiling against abuse, not a measured need.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8011;

        # Django builds URLs and checks ALLOWED_HOSTS and CSRF origins from Host.
        proxy_set_header Host $host;
        # Overwrites anything the client sent: Django trusts this header when
        # DJANGO_HTTPS=True, so it must only ever come from nginx.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Appends the client address; with DJANGO_NUM_PROXIES=1 DRF reads the last
        # entry, which nginx wrote, so a forged header cannot dodge per-IP limits.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # gunicorn's timeout is 120 s (answers take 20 to 45 s, ADR 0017); nginx
        # waits a little longer so gunicorn, not nginx, decides when to give up.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
